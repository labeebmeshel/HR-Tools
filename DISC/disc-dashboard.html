<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRAXI | لوحة نتائج تقييم DISC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
  :root{
    --primary:#0b4fb3; --navy-2:#1e3a8a; --card:#FFFFFF; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --d:#dc2626; --i:#d97706; --s:#059669; --c:#0284c7;
  }
  *{box-sizing:border-box;}
  body{
    background:linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); color:var(--ink);
    font-family:'Segoe UI', Tahoma, sans-serif; min-height:100vh; margin:0; padding:0; direction:rtl;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:25px 15px 60px;}
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:25px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05); }
  h1{font-size:1.2rem; margin:0 0 6px; color:var(--primary); font-weight:800;}
  .sub{color:var(--muted); font-size:0.85rem; margin:0 0 15px;}
  input[type=password], input[type=text]{ width:100%; padding:11px 14px; border-radius:8px; border:1.5px solid var(--line); font-size:0.95rem; outline:none; }
  .btn{ border:none; cursor:pointer; font-weight:700; font-size:0.9rem; padding:10px 18px; border-radius:8px; background:var(--primary); color:#fff; }
  .btn-ghost{background:transparent; color:var(--navy-2); border:1.5px solid var(--line);}
  .hidden{display:none !important;}
  .stat-row{display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:15px;}
  .stat{background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center;}
  .stat b{display:block; font-size:1.3rem; color:var(--primary);}
  .stat span{font-size:0.75rem; color:var(--muted); font-weight:700;}
  .table-scroll{overflow:auto; max-height:500px; border:1px solid var(--line); border-radius:10px;}
  table{width:100%; border-collapse:collapse; font-size:0.85rem;}
  thead th{background:var(--primary); color:#fff; padding:10px; text-align:right; position:sticky; top:0;}
  tbody td{padding:10px; border-bottom:1px solid var(--line); text-align:right;}
  .pill{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:20px; padding:0 5px; border-radius:4px; color:#fff; font-weight:800; font-size:0.75rem;}
  .err-msg{color:var(--d); font-size:0.85rem; margin-top:10px; display:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="card" id="gate">
    <h1>لوحة نتائج تقييم DISC (Google Sheets)</h1>
    <p class="sub">أدخل كلمة المرور الخاصة بجداول بيانات جوجل لجلب نتائجك القديمة.</p>
    <div style="margin-bottom: 12px;">
      <input type="password" id="in-key" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter') unlock()">
    </div>
    <div class="err-msg" id="gate-err">تعذر الاتصال بالخادم أو كلمة المرور غير صحيحة.</div>
    <button class="btn" onclick="unlock()" style="margin-top:10px;">دخول واسترجاع النتائج</button>
  </div>

  <div class="hidden" id="dashboard">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <div>
          <h1>نتائج تقييم DISC المربوطة بالجداول</h1>
          <p class="sub" style="margin:0;">سجل جميع المشاركين من Google Sheets</p>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" onclick="unlock()"><i class="fas fa-rotate"></i> تحديث</button>
          <button class="btn btn-ghost" onclick="exportCSV()"><i class="fas fa-file-excel"></i> تصدير CSV</button>
          <button class="btn btn-ghost" onclick="lock()"><i class="fas fa-lock"></i> قفل</button>
        </div>
      </div>

      <div class="stat-row" id="stat-row"></div>
      <input type="text" id="in-search" placeholder="بحث بالاسم، الوظيفة، أو البريد الإلكتروني..." oninput="renderTable()" style="margin-bottom: 12px;">

      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>التاريخ</th><th>الاسم</th><th>الوظيفة</th><th>الإيميل</th><th>الواتس</th><th>D</th><th>I</th><th>S</th><th>C</th><th>النتيجة</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  // ضع رابط Google Apps Script الخاص بشيت جوجل القديم هنا بين التنصيص:
  var SCRIPT_URL = "ضع_رابط_GOOGLE_APPS_SCRIPT_هنا";

  var globalData = [];

  function unlock() {
    var key = document.getElementById('in-key').value.trim();
    var errEl = document.getElementById('gate-err');
    errEl.style.display = 'none';

    if (!key) return;

    if (!SCRIPT_URL || SCRIPT_URL.indexOf('ضع_رابط') === 0) {
      errEl.textContent = 'يرجى وضع رابط SCRIPT_URL الخاص بك داخل الملف أولاً.';
      errEl.style.display = 'block';
      return;
    }

    fetch(SCRIPT_URL + '?key=' + encodeURIComponent(key))
      .then(res => res.json())
      .then(data => {
        if (!data || !data.ok) { throw new Error(data && data.error || 'unauthorized'); }
        globalData = data.rows || [];
        document.getElementById('gate').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        renderTable();
      })
      .catch(err => {
        errEl.textContent = 'كلمة المرور غير صحيحة، أو تعذر الاتصال بـ Google Sheets.';
        errEl.style.display = 'block';
      });
  }

  function lock() {
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('gate').classList.remove('hidden');
    document.getElementById('in-key').value = '';
  }

  function renderTable() {
    const q = (document.getElementById('in-search') ? document.getElementById('in-search').value : '').toLowerCase();
    const tbody = document.getElementById('tbody');
    const filtered = globalData.filter(r => ((r.name || '') + ' ' + (r.job || '') + ' ' + (r.email || '')).toLowerCase().includes(q));

    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td>${r.date ? new Date(r.date).toLocaleDateString('ar-EG') : '-'}</td>
        <td><b>${r.name || ''}</b></td>
        <td>${r.job || ''}</td>
        <td>${r.email || ''}</td>
        <td>${r.whats || ''}</td>
        <td>${r.D || 0}</td><td>${r.I || 0}</td><td>${r.S || 0}</td><td>${r.C || 0}</td>
        <td>${(r.topResult || '').split('').map(l => `<span class="pill" style="background:${l==='D'?'#dc2626':l==='I'?'#d97706':l==='S'?'#059669':'#0284c7'}">${l}</span>`).join(' ')}</td>
      </tr>
    `).join('');

    const counts = {D:0, I:0, S:0, C:0};
    globalData.forEach(r => (r.topResult || '').split('').forEach(l => { if(counts[l] !== undefined) counts[l]++; }));
    document.getElementById('stat-row').innerHTML = `
      <div class="stat"><b>${globalData.length}</b><span>الإجمالي</span></div>
      <div class="stat"><b style="color:#dc2626">${counts.D}</b><span>D</span></div>
      <div class="stat"><b style="color:#d97706">${counts.I}</b><span>I</span></div>
      <div class="stat"><b style="color:#059669">${counts.S}</b><span>S</span></div>
      <div class="stat"><b style="color:#0284c7">${counts.C}</b><span>C</span></div>
    `;
  }

  function exportCSV() {
    if(!globalData.length) return alert('لا توجد بيانات لتصديرها');
    let csv = "\uFEFFالتاريخ,الاسم,الوظيفة,الإيميل,الواتس,D,I,S,C,النتيجة\n";
    globalData.forEach(r => {
      csv += `"${new Date(r.date).toLocaleString()}","${r.name}","${r.job}","${r.email}","${r.whats}",${r.D},${r.I},${r.S},${r.C},"${r.topResult}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'disc_results_sheets.csv'; a.click();
  }
</script>
</body>
</html>
