<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار وتحليل الشخصية DISC المباشر | PRAXI Academy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
  :root {
    --primary: #0b4fb3;
    --navy-2: #1e3a8a;
    --paper: #f8fafc;
    --card: #FFFFFF;
    --ink: #1e293b;
    --muted: #64748b;
    --line: #e2e8f0;

    --d: #dc2626;
    --i: #d97706;
    --s: #059669;
    --c: #0284c7;
  }

  * { box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    color: var(--ink);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    line-height: 1.7;
    margin: 0; padding: 0;
  }

  .wrap { max-width: 850px; margin: 0 auto; padding: 20px 15px 60px; }

  .brand {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px; text-align: center;
  }
  .brand-name { font-weight: 800; color: var(--primary); font-size: 1.2rem; }
  .brand-name span { color: var(--navy-2); }

  .card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.8);
    border-radius: 16px; padding: 25px 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
  }

  h1 { font-size: 1.3rem; margin: 0 0 6px; color: var(--primary); font-weight: 800; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }

  .field { margin-bottom: 15px; text-align: right; }
  label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--navy-2); margin-bottom: 5px; }
  input[type=text], input[type=email], input[type=tel] {
    width: 100%; padding: 11px 13px; border-radius: 8px; border: 1.5px solid var(--line);
    font-size: 0.95rem; background: #FCFBF9; color: var(--ink); outline: none; transition: 0.2s;
  }
  input:focus { border-color: var(--primary); background: #fff; }
  .err { color: var(--d); font-size: 0.8rem; margin-top: 4px; display: none; }
  .field.invalid input { border-color: var(--d); }
  .field.invalid .err { display: block; }

  .btn {
    border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.95rem;
    padding: 12px 22px; border-radius: 8px; background: var(--primary); color: #fff;
    transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  }
  .btn:hover { background: var(--navy-2); }
  .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

  .hidden { display: none !important; }

  /* Quiz Style */
  .qhead {
    position: sticky; top: 0; background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(5px); z-index: 5;
    padding: 10px 0; margin-bottom: 12px;
  }
  .progress-outer { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progress-inner { height: 100%; background: linear-gradient(90deg, var(--primary), var(--navy-2)); width: 0%; transition: width .25s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-top: 6px; font-weight: 600; }

  .qcard {
    border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 14px; background: #fff;
  }
  .qcard.answered { border-color: var(--primary); background: #f8fafc; }
  .qnum {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border-radius: 50%; background: var(--primary); color: #fff; font-size: 0.8rem; font-weight: 800; margin-inline-start: 6px;
  }
  .qtext { font-size: 0.95rem; font-weight: 700; color: var(--ink); margin: 2px 0 12px; text-align: right; }
  
  .scale { display: flex; gap: 6px; }
  .scale .opt-btn {
    flex: 1; padding: 10px 2px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff;
    cursor: pointer; font-weight: 700; font-size: 0.95rem; color: var(--navy-2); transition: 0.15s;
  }
  .scale .opt-btn.sel { background: var(--primary) !important; border-color: var(--primary) !important; color: #fff !important; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 6px; font-weight: 600; }

  /* Results */
  .badge-final { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin: 8px 0 4px; }
  .badge-final .letter { font-size: 52px; font-weight: 900; line-height: 1; }
  .result-title { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 2px; font-weight: 600; }
  .result-name { text-align: center; font-size: 1.05rem; color: var(--primary); margin-bottom: 18px; font-weight: 800; }

  .bars { margin: 15px 0 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar-letter { width: 32px; height: 32px; border-radius: 8px; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; }
  .bar-track { flex: 1; height: 16px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; width: 0%; transition: width .6s ease; }
  .bar-score { width: 30px; text-align: left; font-weight: 800; font-size: 0.85rem; color: var(--primary); }

  .desc-box { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-top: 15px; font-size: 0.9rem; color: var(--ink); text-align: right; }

  @media (max-width: 600px) {
    .wrap { padding: 10px; }
    .card { padding: 18px 12px; }
    .scale .opt-btn { padding: 8px 1px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="brand-name">الميثاق الذكي <span>| PRAXI Academy</span></div>
  </div>

  <div class="card" id="stage-intro">
    <h1>بيانات المشارك في تقييم DISC</h1>
    <p class="sub">سجل بياناتك للبدء مباشرة في تقييم الأنماط السلوكية (44 سؤالاً).</p>

    <div class="field" id="f-name">
      <label>الاسم بالكامل</label>
      <input type="text" id="in-name" placeholder="اكتب اسمك">
      <div class="err">من فضلك اكتب الاسم</div>
    </div>

    <div class="field" id="f-job">
      <label>الوظيفة</label>
      <input type="text" id="in-job" placeholder="المسمى الوظيفي">
      <div class="err">من فضلك اكتب الوظيفة</div>
    </div>

    <div class="field" id="f-email">
      <label>البريد الإلكتروني</label>
      <input type="email" id="in-email" placeholder="example@email.com">
      <div class="err">من فضلك اكتب بريد إلكتروني صحيح</div>
    </div>

    <div class="field" id="f-whats">
      <label>رقم الواتس</label>
      <input type="tel" id="in-whats" placeholder="01xxxxxxxxx">
      <div class="err">من فضلك اكتب رقم واتس صحيح</div>
    </div>

    <button class="btn" id="btn-start">بدء التقييم الآن ←</button>
  </div>

  <div class="hidden" id="stage-quiz">
    <div class="qhead">
      <div class="progress-outer"><div class="progress-inner" id="progress-bar"></div></div>
      <div class="progress-label">
        <span id="progress-text">0 / 44 تمت الإجابة عليها</span>
        <span>تقييم DISC المباشر</span>
      </div>
    </div>

    <div id="questions-holder"></div>

    <div style="margin-top: 15px;">
      <button class="btn" id="btn-finish" disabled>عرض النتيجة النهائية</button>
    </div>
  </div>

  <div class="hidden" id="stage-results">
    <div class="card">
      <div class="result-title">النمط السلوكي الغالب حسب DISC</div>
      <div class="badge-final" id="badge-final"></div>
      <div class="result-name" id="result-name"></div>

      <div class="bars" id="bars-holder"></div>
      <div class="desc-box" id="desc-box"></div>

      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة النتيجة PDF</button>
      </div>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVQ7OIVjfajk3MpFFB_DJpOo8tswCk6eM",
    authDomain: "smart-charter-disc-7d1e5.firebaseapp.com",
    databaseURL: "https://smart-charter-disc-7d1e5-default-rtdb.firebaseio.com",
    projectId: "smart-charter-disc-7d1e5",
    storageBucket: "smart-charter-disc-7d1e5.firebasestorage.app",
    messagingSenderId: "260611412584",
    appId: "1:260611412584:web:7ee244ebcfd08da796a1dd"
  };

  firebase.initializeApp(firebaseConfig);
  const dbRef = firebase.database().ref('disc_results');

  var QUESTIONS = [
    "أنا شخص قيادي ومهتم بتحقيق نتائج ملموسة", "بستمتع بالتعامل مع الناس ومقابلتهم",
    "تصرفاتي ثابتة ويسهل على الآخرين توقعها", "بحب الأعمال اللي فيها تواصل مباشر مع الناس",
    "شخصيتي قوية ومؤثرة", "الناس بتحبني وبتشوف فيا قائد",
    "بفضّل الاستقرار في شغلانة واحدة بدل التنقل بين مهام كتير", "عندي علاقات واسعة والناس بتحبني",
    "بحب التحديات وبقبلها بسهولة", "عندي مهارة في الكلام والإلقاء قدام الناس",
    "صبور جدًا في الشغل اللي محتاج دقة وتفاصيل", "مش بتضايق لو رئيسي بيراقب شغلي",
    "بقرر بسرعة", "بحفز الناس اللي حواليا", "مش بحب التغيير الكتير في شغلي",
    "بجيد في التعامل مع الناس والكلام معاهم", "ممكن أكسر التعليمات لو الشغل يتطلب كده",
    "بحقق إنتاج كبير وسريع من خلال تنظيم شغل الناس اللي حواليا", "بخلص المهمة اللي في إيدي قبل ما أبدأ في تانية",
    "العلاقات ورضا الناس أهم عندي من إنجاز المهام بسرعة", "بحب أخد صلاحيات أكتر في شغلي",
    "بترك انطباع كويس أول ما الناس تقابلني", "ولائي عالي للجهة اللي بشتغل فيها وبدافع عنها",
    "بطيع أوامر رؤسائي بسهولة", "التغييرات الكبيرة مش بتضايقني", "بحب أساعد غيري",
    "مش بحب أستعجل في الشغل", "بخاف من الغلط عشان محدش يزعل مني",
    "بفضّل إني أدير الشغل وأوجه الناس", "بفضّل إن الناس تشاركني في إدارة الشغل",
    "هادئ وبقدر أهدي اللي حواليا", "بقيّم شغلي وشغل غيري باستمرار",
    "بحب الأنشطة الجماعية", "بسمع لغيري باهتمام وحب",
    "بحب إن التطور يكون تدريجي مش مفاجئ", "بفكر بحرص عشان محافظش أخسر علاقاتي",
    "بحل المشاكل حتى لو من غير مراعاة مشاعر التانيين", "بخالف اللوائح بطريقة ذكية لو محتاج",
    "حريص إني ألتزم بالأنظمة والقواعد", "بتعامل بمرونة مع غيري",
    "توجيهاتي لغيري واضحة ومباشرة", "بقدر أحرك الناس من غير ما أدي أوامر واضحة",
    "بفضّل الأنظمة الثابتة بدل الأوامر المباشرة", "تنفيذ الأوامر مش بيضايقني"
  ];

  var CAT_ORDER = ['D','I','S','C'];
  var CAT_NAME = {D:'القيادة (Dominance)', I:'التأثير (Influence)', S:'الثبات (Steadiness)', C:'الالتزام (Compliance)'};
  var CAT_COLOR = {D:'var(--d)', I:'var(--i)', S:'var(--s)', C:'var(--c)'};
  var CAT_DESC = {
    D: "شخصية حاسمة وسريعة في اتخاذ القرار، بتحب التحدي والنتائج العملية، وبتفضل تاخد زمام المبادرة وتقود المواقف.",
    I: "شخصية اجتماعية ومتفائلة، بتقدر تأثر في الناس بسهولة، وبتبني علاقات واسعة، وبتحب الأنشطة الجماعية والتواصل مع الآخرين.",
    S: "شخصية هادئة وصبورة، بتحافظ على الاستقرار والعلاقات، وبتفضل التطور التدريجي بدل التغييرات المفاجئة، ومخلصة جدًا لفريقها.",
    C: "شخصية دقيقة ومنظمة، بتحب الالتزام بالأنظمة والقواعد، وبتحرص على الجودة والتفاصيل قبل اتخاذ أي قرار."
  };

  function categoryOf(idx) { return CAT_ORDER[idx % 4]; }

  var answers = {};
  var userInfo = {};

  function validateField(fieldId, inputId, validatorFn){
    var field = document.getElementById(fieldId);
    var input = document.getElementById(inputId);
    var ok = validatorFn(input.value.trim());
    field.classList.toggle('invalid', !ok);
    return ok;
  }

  document.getElementById('btn-start').addEventListener('click', function(){
    var okName = validateField('f-name','in-name', v => v.length > 1);
    var okJob = validateField('f-job','in-job', v => v.length > 1);
    var okEmail = validateField('f-email','in-email', v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v));
    var okWhats = validateField('f-whats','in-whats', v => /^[0-9+\s]{8,}$/.test(v));

    if(!(okName && okJob && okEmail && okWhats)) return;

    userInfo = {
      name: document.getElementById('in-name').value.trim(),
      job: document.getElementById('in-job').value.trim(),
      email: document.getElementById('in-email').value.trim(),
      whats: document.getElementById('in-whats').value.trim()
    };

    buildQuiz();
    document.getElementById('stage-intro').classList.add('hidden');
    document.getElementById('stage-quiz').classList.remove('hidden');
    window.scrollTo(0,0);
  });

  function buildQuiz(){
    var holder = document.getElementById('questions-holder');
    holder.innerHTML = '';
    
    QUESTIONS.forEach(function(text, idx){
      var card = document.createElement('div');
      card.className = 'qcard';
      card.id = 'qcard-' + idx;

      var qtext = document.createElement('div');
      qtext.className = 'qtext';
      qtext.innerHTML = '<span class="qnum">' + (idx+1) + '</span>' + text;
      card.appendChild(qtext);

      var scale = document.createElement('div');
      scale.className = 'scale';

      for(var v=1; v<=5; v++){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt-btn';
        b.textContent = v;
        b.setAttribute('data-q', idx);
        b.setAttribute('data-v', v);

        b.addEventListener('click', function(e){
          var qIdx = parseInt(this.getAttribute('data-q'));
          var val = parseInt(this.getAttribute('data-v'));

          answers[qIdx] = val;

          var parentScale = this.parentElement;
          var btnList = parentScale.querySelectorAll('.opt-btn');
          btnList.forEach(function(btn){ btn.classList.remove('sel'); });

          this.classList.add('sel');
          document.getElementById('qcard-' + qIdx).classList.add('answered');

          updateProgress();
        });

        scale.appendChild(b);
      }

      card.appendChild(scale);

      var labels = document.createElement('div');
      labels.className = 'scale-labels';
      labels.innerHTML = '<span>1 - أقل حاجة تشبهني</span><span>5 - أكتر حاجة تشبهني</span>';
      card.appendChild(labels);

      holder.appendChild(card);
    });

    updateProgress();
  }

  function updateProgress(){
    var answered = Object.keys(answers).length;
    var pct = Math.round((answered/44)*100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = answered + ' / 44 تمت الإجابة عليها';
    document.getElementById('btn-finish').disabled = (answered < 44);
  }

  document.getElementById('btn-finish').addEventListener('click', function(){
    if(Object.keys(answers).length < 44) return;
    computeResults();
    document.getElementById('stage-quiz').classList.add('hidden');
    document.getElementById('stage-results').classList.remove('hidden');
    window.scrollTo(0,0);
  });

  function computeResults(){
    var totals = {D:0,I:0,S:0,C:0};
    QUESTIONS.forEach(function(_, idx){ totals[categoryOf(idx)] += answers[idx]; });

    var sorted = CAT_ORDER.slice().sort((a,b) => totals[b]-totals[a]);
    var top2 = sorted.slice(0,2);

    document.getElementById('badge-final').innerHTML = top2.map(c => `<span class="letter" style="color:${CAT_COLOR[c]}">${c}</span>`).join('');
    document.getElementById('result-name').textContent = userInfo.name + ' — ' + userInfo.job;

    var barsHolder = document.getElementById('bars-holder');
    barsHolder.innerHTML = '';
    sorted.forEach(function(cat){
      barsHolder.innerHTML += `
        <div class="bar-row">
          <div class="bar-letter" style="background:${CAT_COLOR[cat]}">${cat}</div>
          <div class="bar-track"><div class="bar-fill" style="background:${CAT_COLOR[cat]}; width:${Math.round((totals[cat]/55)*100)}%"></div></div>
          <div class="bar-score">${totals[cat]}</div>
        </div>`;
    });

    document.getElementById('desc-box').innerHTML = top2.map(c => `<div style="margin-bottom:10px;"><b style="color:${CAT_COLOR[c]}">${c} — ${CAT_NAME[c]}:</b> ${CAT_DESC[c]}</div>`).join('');

    dbRef.push({
      date: new Date().toISOString(),
      name: userInfo.name,
      job: userInfo.job,
      email: userInfo.email,
      whats: userInfo.whats,
      D: totals.D, I: totals.I, S: totals.S, C: totals.C,
      topResult: top2.join('')
    });
  }
</script>
</body>
</html>
