<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فريق الإعداد والتطوير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f7fc; padding: 40px; text-align: center; }
        .team-card { background: white; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h1 { color: #0b4fb3; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 25px; }
        .member { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #e2e8f0; }
        .member-title { font-weight: bold; color: #1e293b; }
    </style>
</head>
<body>
    <div class="team-card">
        <h1>فريق الإعداد والتطوير</h1>
        <p>نخبة الكوادر المسئولة عن تطوير المنظومة والأدوات المتاحة</p>
        <div class="member">
            <span class="member-title">د. لبيب ميشيل</span>
            <span>استشاري الموارد البشرية والتحول الرقمي</span>
        </div>
        <div class="member">
            <span class="member-title">أكاديمية براكسي (PRAXI Academy)</span>
            <span>إعداد وتدقيق القوانين والضرائب</span>
        </div>
    </div>
</body>
</html>
