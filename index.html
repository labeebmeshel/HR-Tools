<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labeeb Meshel - HR Platform System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0b4fb3;
            --primary-dark: #0b2a5c;
            --bg-light: #f4f7fc;
            --sidebar-width: 270px;
            --white: #ffffff;
            --text: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-light); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* ===== شاشة تسجيل الدخول ===== */
        #loginScreen {
            position: fixed; inset: 0; background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            z-index: 99999; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: white; width: 380px; padding: 35px; border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center;
        }
        .login-card h2 { color: var(--primary-dark); margin-bottom: 20px; font-size: 1.4rem; }
        .form-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .login-error { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; }

        /* ===== القائمة الجانبية (Sidebar) ===== */
        .sidebar {
            width: var(--sidebar-width); background: var(--primary-dark); color: white;
            display: flex; flex-direction: column; height: 100vh; z-index: 1000; flex-shrink: 0;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h3 { font-size: 1.1rem; color: #fff; }
        .sidebar-header p { font-size: 0.75rem; color: #fcd34d; margin-top: 4px; }

        .nav-list { flex: 1; overflow-y: auto; padding: 15px 10px; list-style: none; }
        .nav-item { margin-bottom: 5px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px;
            color: rgba(255,255,255,0.8); text-decoration: none; border-radius: 8px;
            cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: 0.2s; border: none; background: none; width: 100%; text-align: right;
        }
        .nav-link:hover, .nav-link.active { background: var(--primary); color: white; }
        .nav-link i { width: 20px; text-align: center; font-size: 1.1rem; }

        /* Submenu */
        .submenu { display: none; list-style: none; padding-right: 25px; margin-top: 4px; }
        .submenu.active { display: block; }
        .submenu-btn {
            display: block; width: 100%; text-align: right; padding: 8px 12px;
            color: rgba(255,255,255,0.7); border: none; background: none; cursor: pointer;
            font-size: 0.85rem; border-radius: 6px; transition: 0.2s;
        }
        .submenu-btn:hover, .submenu-btn.active { color: #fcd34d; background: rgba(255,255,255,0.05); }

        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        /* ===== المحتوى الرئيسي ===== */
        .main-wrapper { flex: 1; height: 100vh; position: relative; overflow: hidden; }
        .page-frame { width: 100%; height: 100%; border: none; display: none; }
        .page-frame.active { display: block; }

        /* ===== لوحة الأدمن (Admin Dashboard) ===== */
        .admin-dashboard { padding: 30px; height: 100%; overflow-y: auto; background: var(--bg-light); }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .admin-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .admin-card h4 { margin-bottom: 15px; color: var(--primary); }
        .logs-table, .users-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .logs-table th, .users-table th, .logs-table td, .users-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        .logs-table th, .users-table th { background: #f8fafc; color: var(--primary-dark); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .nav-list { display: flex; overflow-x: auto; }
            .main-wrapper { height: calc(100vh - 120px); }
        }
    </style>
</head>
<body>

    <!-- شاشة حماية الدخول -->
    <div id="loginScreen">
        <div class="login-card">
            <i class="fas fa-lock fa-3x" style="color: var(--primary); margin-bottom: 15px;"></i>
            <h2>تسجيل الدخول للنظام</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="text" id="loginUsername" class="form-input" placeholder="اسم المستخدم" required>
                <input type="password" id="loginPassword" class="form-input" placeholder="كلمة المرور" required>
                <button type="submit" class="btn-login">دخول</button>
            </form>
            <div id="loginError" class="login-error">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <!-- القائمة الجانبية (Sidebar Navigation) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>PRAXI HR System</h3>
            <p id="currentUserBadge">أهلاً بك</p>
        </div>
        
        <ul class="nav-list" id="mainNav">
            <li class="nav-item">
                <button class="nav-link active" onclick="loadPage(event, 'home-frame', this)">
                    <i class="fas fa-house"></i> الرئيسية
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'cv-frame', this)">
                    <i class="fas fa-id-card"></i> السيرة الذاتية
                </button>
            </li>

            <!-- تابة القائمة المنسدلة للضرائب -->
            <li class="nav-item">
                <button class="nav-link" onclick="toggleSubmenu('taxSubmenu')">
                    <i class="fas fa-calculator"></i> حاسبات الضرائب ▾
                </button>
                <ul class="submenu" id="taxSubmenu">
                    <li><button class="submenu-btn" onclick="loadDropdownPage(event, 'tax-frame', 'حاسبة الضرائب (إجمالي ← صافي)', this)">إجمالي ← صافي</button></li>
                    <li><button class="submenu-btn" onclick="loadDropdownPage(event, 'tax-reverse-frame', 'عكس الضريبة فردي', this)">صافي ← إجمالي (فردي)</button></li>
                    <li><button class="submenu-btn" onclick="loadDropdownPage(event, 'tax-reverse-bulk-frame', 'عكس الضريبة جماعي', this)">صافي ← إجمالي (جماعي)</button></li>
                </ul>
            </li>

            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 's1-frame', this)">
                    <i class="fas fa-file-contract"></i> س1 تأمينات
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'forms-print-frame', this)">
                    <i class="fas fa-print"></i> طباعة النماذج
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'team-frame', this)">
                    <i class="fas fa-users-gear"></i> فريق الإعداد
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'tafqit-frame', this)">
                    <i class="fas fa-spell-check"></i> أداة التفقيط
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'feedback-frame', this)">
                    <i class="fas fa-chart-line"></i> قياس الأداء
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'disc-frame', this)">
                    <i class="fas fa-user-gear"></i> تحليل الشخصية
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'scan-frame', this)">
                    <i class="fas fa-file-excel"></i> HR Scan → Excel
                </button>
            </li>
            
            <!-- تابة الأدمن تظهر فقط لمدير النظام -->
            <li class="nav-item" id="adminTabItem" style="display: none;">
                <button class="nav-link" style="color: #fcd34d;" onclick="loadPage(event, 'admin-dashboard-frame', this)">
                    <i class="fas fa-user-shield"></i> لوحة الأدمن والـ Logs
                </button>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="user-info">
                <span id="activeUsername">User</span>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-right-from-bracket"></i> خروج</button>
            </div>
        </div>
    </aside>

    <!-- منطقة عرض الأطر (iFrames & Views) -->
    <main class="main-wrapper">
        <iframe id="home-frame" class="page-frame active" src="home.html"></iframe>
        <iframe id="cv-frame" class="page-frame" src="cv.html"></iframe>
        <iframe id="tax-frame" class="page-frame" src="tax.html"></iframe>
        <iframe id="tax-reverse-frame" class="page-frame" src="tax-reverse.html"></iframe>
        <iframe id="tax-reverse-bulk-frame" class="page-frame" src="tax-reverse-bulk.html"></iframe>
        <iframe id="s1-frame" class="page-frame" src="s1.html"></iframe>
        <iframe id="forms-print-frame" class="page-frame" src="./hr-forms/index.html"></iframe>
        <iframe id="team-frame" class="page-frame" src="team.html"></iframe>
        <iframe id="tafqit-frame" class="page-frame" src="tafqit.html"></iframe>
        <iframe id="feedback-frame" class="page-frame" src="feedback.html"></iframe>
        <iframe id="disc-frame" class="page-frame" src="disc.html"></iframe>
        <iframe id="scan-frame" class="page-frame" src="scan-to-excel.html"></iframe>

        <!-- الداشبورد الداخلية للأدمن (Logs & User Management) -->
        <div id="admin-dashboard-frame" class="page-frame admin-dashboard">
            <h2><i class="fas fa-user-shield"></i> لوحة تحكم الأدمن ومتابعة النظام</h2>
            
            <div class="admin-grid">
                <!-- إضافة يوزر جديد -->
                <div class="admin-card">
                    <h4><i class="fas fa-user-plus"></i> إضافة مستخدم جديد</h4>
                    <form onsubmit="addNewUser(event)">
                        <input type="text" id="newUsername" class="form-input" placeholder="اسم المستخدم" required>
                        <input type="password" id="newPassword" class="form-input" placeholder="كلمة المرور" required>
                        <select id="newRole" class="form-input">
                            <option value="user">مستخدم عادي (User)</option>
                            <option value="admin">مدير نظام (Admin)</option>
                        </select>
                        <button type="submit" class="btn-login" style="background: #10b981;">حفظ المستخدم</button>
                    </form>
                    
                    <h4 style="margin-top: 25px;"><i class="fas fa-users"></i> قائمة المستخدمين الحاليين</h4>
                    <table class="users-table">
                        <thead>
                            <tr><th>اسم المستخدم</th><th>الصلاحية</th></tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>

                <!-- سجل الحركات (System Logs) -->
                <div class="admin-card">
                    <h4><i class="fas fa-history"></i> سجل الحركات والزيارات (Audit Logs)</h4>
                    <div style="max-height: 400px; overflow-y: auto;">
                        <table class="logs-table">
                            <thead>
                                <tr><th>التاريخ والتوقيت</th><th>المستخدم</th><th>الجراء / الصفحة</th></tr>
                            </thead>
                            <tbody id="logsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // قواعد البيانات المحلية للمستخدمين والـ Logs
        const DEFAULT_USERS = [
            { username: "admin", pass: "admin123", role: "admin" },
            { username: "labeeb", pass: "123456", role: "user" }
        ];

        function getUsersDB() {
            const db = localStorage.getItem('SYSTEM_USERS');
            return db ? JSON.parse(db) : DEFAULT_USERS;
        }

        function getLogsDB() {
            const db = localStorage.getItem('SYSTEM_LOGS');
            return db ? JSON.parse(db) : [];
        }

        function addLog(action) {
            const currentUser = sessionStorage.getItem('LOGGED_USER') || 'مجهول';
            const logs = getLogsDB();
            logs.unshift({
                time: new Date().toLocaleString('ar-EG'),
                user: currentUser,
                action: action
            });
            localStorage.setItem('SYSTEM_LOGS', JSON.stringify(logs));
            renderLogsTable();
        }

        // تسجيل الدخول
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const users = getUsersDB();

            const found = users.find(user => user.username === u && user.pass === p);

            if (found) {
                sessionStorage.setItem('LOGGED_USER', found.username);
                sessionStorage.setItem('USER_ROLE', found.role);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('activeUsername').innerText = found.username;
                document.getElementById('currentUserBadge').innerText = found.role === 'admin' ? 'مدير النظام (Admin)' : 'أهلاً بك';

                if (found.role === 'admin') {
                    document.getElementById('adminTabItem').style.display = 'block';
                }

                addLog('تسجيل الدخول للنظام');
                renderUsersTable();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            addLog('تسجيل الخروج');
            sessionStorage.clear();
            location.reload();
        }

        // التنقل بين التابات والإطارات
        function loadPage(evt, frameId, btnElement) {
            if (evt) evt.preventDefault();
            
            document.querySelectorAll('.page-frame').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.submenu-btn').forEach(b => b.classList.remove('active'));
            
            const targetFrame = document.getElementById(frameId);
            if (targetFrame) {
                targetFrame.classList.add('active');
            }

            if (btnElement && btnElement.classList) {
                btnElement.classList.add('active');
            }

            addLog(`فتح صفحة: ${frameId}`);
        }

        function toggleSubmenu(id) {
            const menu = document.getElementById(id);
            menu.classList.toggle('active');
        }

        function loadDropdownPage(evt, frameId, title, btnElement) {
            if (evt) evt.stopPropagation();
            loadPage(evt, frameId, btnElement);
        }

        // إدارات الأدمن
        function addNewUser(e) {
            e.preventDefault();
            const u = document.getElementById('newUsername').value.trim();
            const p = document.getElementById('newPassword').value.trim();
            const r = document.getElementById('newRole').value;

            const users = getUsersDB();
            users.push({ username: u, pass: p, role: r });
            localStorage.setItem('SYSTEM_USERS', JSON.stringify(users));

            addLog(`إضافة مستخدم جديد: ${u} (${r})`);
            alert('تمت إضافة المستخدم بنجاح!');
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            renderUsersTable();
        }

        function renderUsersTable() {
            const users = getUsersDB();
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            users.forEach(u => {
                tbody.innerHTML += `<tr><td>${u.username}</td><td>${u.role}</td></tr>`;
            });
        }

        function renderLogsTable() {
            const logs = getLogsDB();
            const tbody = document.getElementById('logsTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';
            logs.slice(0, 50).forEach(l => {
                tbody.innerHTML += `<tr><td>${l.time}</td><td>${l.user}</td><td>${l.action}</td></tr>`;
            });
        }

        // التحقق عند التحميل
        window.onload = function() {
            const logged = sessionStorage.getItem('LOGGED_USER');
            if (logged) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('activeUsername').innerText = logged;
                if (sessionStorage.getItem('USER_ROLE') === 'admin') {
                    document.getElementById('adminTabItem').style.display = 'block';
                }
                renderLogsTable();
                renderUsersTable();
            }
        };
    </script>
</body>
</html>
