<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة الموارد البشرية والشركات الشاملة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات قراءة ملفات Excel السريعة -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- مكتبات Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0b4fb3;
            --primary-dark: #0b2a5c;
            --bg-light: #f4f7fc;
            --sidebar-width: 270px;
            --white: #ffffff;
            --text: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-light); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* شاشة تسجيل الدخول */
        #loginScreen {
            position: fixed; inset: 0; background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            z-index: 99999; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: white; width: 420px; padding: 35px; border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center;
        }
        .login-card h2 { color: var(--primary-dark); margin-bottom: 20px; font-size: 1.4rem; }
        .form-input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .btn-action { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: var(--primary-dark); }
        .login-error { color: var(--danger); font-size: 0.85rem; margin-top: 10px; display: none; }

        /* القائمة الجانبية */
        .sidebar {
            width: var(--sidebar-width); background: var(--primary-dark); color: white;
            display: flex; flex-direction: column; height: 100vh; z-index: 1000; flex-shrink: 0;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .sidebar-header { padding: 20px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .company-logo-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #fcd34d; background: #fff; display: none; }
        .sidebar-header h3 { font-size: 1rem; color: #fff; font-weight: bold; }
        .sidebar-header p { font-size: 0.75rem; color: #fcd34d; margin-top: 2px; }

        .nav-list { flex: 1; overflow-y: auto; padding: 15px 10px; list-style: none; }
        .nav-item { margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 11px 14px;
            color: rgba(255,255,255,0.8); text-decoration: none; border-radius: 8px;
            cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: 0.2s; border: none; background: none; width: 100%; text-align: right;
        }
        .nav-link:hover, .nav-link.active { background: var(--primary); color: white; }
        .nav-link i { width: 20px; text-align: center; font-size: 1.05rem; }

        .submenu { display: none; list-style: none; padding-right: 25px; margin-top: 4px; }
        .submenu.active { display: block; }
        .submenu-btn {
            display: block; width: 100%; text-align: right; padding: 8px 12px;
            color: rgba(255,255,255,0.7); border: none; background: none; cursor: pointer;
            font-size: 0.85rem; border-radius: 6px; transition: 0.2s;
        }
        .submenu-btn:hover, .submenu-btn.active { color: #fcd34d; background: rgba(255,255,255,0.05); }

        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .btn-logout { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

        /* الشاشات الرئيسية */
        .main-wrapper { flex: 1; height: 100vh; position: relative; overflow: hidden; }
        .page-frame { width: 100%; height: 100%; border: none; display: none; }
        .page-frame.active { display: block; }

        .inner-view { padding: 30px; height: 100%; overflow-y: auto; background: var(--bg-light); }
        .card-panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-panel h3 { color: var(--primary-dark); margin-bottom: 15px; font-size: 1.1rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .status-online { background: #d1fae5; color: #065f46; }
        .status-offline { background: #fee2e2; color: #991b1b; }

        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen">
        <div class="login-card">
            <i class="fas fa-user-shield fa-3x" style="color: var(--primary); margin-bottom: 15px;"></i>
            <h2>تسجيل الدخول للنظام</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="text" id="loginUsername" class="form-input" placeholder="اسم المستخدم (Username)" required>
                <input type="password" id="loginPassword" class="form-input" placeholder="كلمة المرور (Password)" required>
                <button type="submit" class="btn-action">دخول</button>
            </form>
            <div id="loginError" class="login-error">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img id="sidebarLogo" src="" class="company-logo-img" alt="لوجو الشركة">
            <h3 id="sidebarCompName">اسم الشركة</h3>
            <p id="sidebarCompField">مجال الشركة</p>
            <div style="margin-top: 6px;">
                <span id="dbConnectionStatus" class="status-badge status-offline">جاري الاتصال...</span>
            </div>
        </div>
        
        <ul class="nav-list" id="mainNav">
            <li class="nav-item">
                <button class="nav-link active" onclick="loadPage(event, 'home-frame', this)">
                    <i class="fas fa-house"></i> الرئيسية
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'profile-view-frame', this)">
                    <i class="fas fa-building-user"></i> بروفايل الشركة والحساب
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'cv-frame', this)">
                    <i class="fas fa-id-card"></i> السيرة الذاتية
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" onclick="toggleSubmenu('taxSubmenu')">
                    <i class="fas fa-calculator"></i> حاسبات الضرائب ▾
                </button>
                <ul class="submenu" id="taxSubmenu">
                    <li><button class="submenu-btn" onclick="loadDropdownPage(event, 'tax-frame', 'إجمالي ← صافي', this)">إجمالي ← صافي</button></li>
                    <li><button class="submenu-btn" onclick="loadDropdownPage(event, 'tax-reverse-frame', 'عكس الضريبة فردي', this)">صافي ← إجمالي (فردي)</button></li>
                    <li><button class="submenu-btn" onclick="loadDropdownPage(event, 'tax-reverse-bulk-frame', 'عكس الضريبة جماعي', this)">صافي ← إجمالي (جماعي)</button></li>
                </ul>
            </li>

            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 's1-frame', this)">
                    <i class="fas fa-file-contract"></i> س1 تأمينات
                </button>
            </li>
            
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'forms-print-frame', this)">
                    <i class="fas fa-print"></i> طباعة النماذج الرسمية
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'labels-frame', this)">
                    <i class="fas fa-tags"></i> ملصقات الموظفين (A4 Labels)
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'team-frame', this)">
                    <i class="fas fa-users-gear"></i> فريق الإعداد
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'tafqit-frame', this)">
                    <i class="fas fa-spell-check"></i> أداة التفقيط
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'feedback-frame', this)">
                    <i class="fas fa-chart-line"></i> قياس الأداء
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" onclick="toggleSubmenu('discSubmenu')">
                    <i class="fas fa-user-gear"></i> تحليل الشخصية (DISC) ▾
                </button>
                <ul class="submenu" id="discSubmenu">
                    <li><button class="submenu-btn" onclick="loadDropdownPage(event, 'disc-frame', 'تقييم DISC', this)">إجراء تقييم DISC</button></li>
                    <li><button class="submenu-btn" onclick="loadDropdownPage(event, 'disc-dash-frame', 'لوحة نتائج DISC', this)">لوحة نتائج DISC</button></li>
                </ul>
            </li>

            <li class="nav-item">
                <button class="nav-link" onclick="loadPage(event, 'scan-frame', this)">
                    <i class="fas fa-file-excel"></i> HR Scan → Excel
                </button>
            </li>
            
            <!-- زر لوحة تحكم الأدمن (فتح الملف الخارجي) -->
            <li class="nav-item" id="adminTabItem" style="display: none;">
                <button class="nav-link" style="color: #fcd34d;" onclick="loadPage(event, 'admin-dashboard-frame', this)">
                    <i class="fas fa-user-shield"></i> لوحة تحكم الأدمن الرئيسية
                </button>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="user-info">
                <div>
                    <strong id="activeUsername">User</strong><br>
                    <small id="activeUserRole" style="color: #cbd5e1;">Role</small>
                </div>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-right-from-bracket"></i> خروج</button>
            </div>
        </div>
    </aside>

    <main class="main-wrapper">
        <iframe id="home-frame" class="page-frame active" src="home.html"></iframe>
        <iframe id="cv-frame" class="page-frame" src="cv.html"></iframe>
        <iframe id="tax-frame" class="page-frame" src="./Tax/tax.html"></iframe>
        <iframe id="tax-reverse-frame" class="page-frame" src="./Tax/tax-reverse.html"></iframe>
        <iframe id="tax-reverse-bulk-frame" class="page-frame" src="./Tax/tax-reverse-bulk.html"></iframe>
        <iframe id="s1-frame" class="page-frame" src="s1.html"></iframe>
        <iframe id="forms-print-frame" class="page-frame" src="./hr-forms/index.html"></iframe>
        <iframe id="labels-frame" class="page-frame" src="./labels/index.html"></iframe>
        <iframe id="team-frame" class="page-frame" src="./Team/team.html"></iframe>
        <iframe id="tafqit-frame" class="page-frame" src="tafqit.html"></iframe>
        <iframe id="feedback-frame" class="page-frame" src="feedback.html"></iframe>
        <iframe id="disc-frame" class="page-frame" src="./DISC/disc.html"></iframe>
        <iframe id="disc-dash-frame" class="page-frame" src="./DISC/disc-dashboard.html"></iframe>
        <iframe id="scan-frame" class="page-frame" src="scan-to-excel.html"></iframe>
        
        <!-- إطار لوحة تحكم الأدمن المستقلة والمحدثة -->
        <iframe id="admin-dashboard-frame" class="page-frame" src="admin-dashboard.html"></iframe>

        <!-- بروفايل الحساب والشركة -->
        <div id="profile-view-frame" class="page-frame inner-view">
            <h2><i class="fas fa-building-user"></i> إدارة بروفايل الشركة والحساب الشخصي</h2>
            <br>
            <div class="grid-2">
                <div class="card-panel">
                    <h3><i class="fas fa-building"></i> تعديل بيانات الشركة والشعار</h3>
                    <form onsubmit="saveCompanyProfile(event)">
                        <label>اسم الشركة:</label>
                        <input type="text" id="profCompName" class="form-input" placeholder="أدخل اسم الشركة" required>
                        <label>مجال الشركة:</label>
                        <input type="text" id="profCompField" class="form-input" placeholder="أدخل المجال" required>
                        <label>رقم الهاتف:</label>
                        <input type="text" id="profCompPhone" class="form-input" placeholder="رقم التواصل">
                        <label>رابط الشعار / رفع اللوجو:</label>
                        <input type="file" accept="image/*" class="form-input" onchange="convertImageToBase64(this, 'profCompLogo')">
                        <input type="hidden" id="profCompLogo">
                        <label>اسم المسؤول:</label>
                        <input type="text" id="profCompAdmin" class="form-input" placeholder="اسم المسؤول">
                        <button type="submit" class="btn-action" style="margin-top: 10px;">حفظ التغييرات</button>
                    </form>
                </div>

                <div class="card-panel">
                    <h3><i class="fas fa-key"></i> تغيير كلمة المرور</h3>
                    <form onsubmit="updateUserPassword(event)">
                        <label>اسم المستخدم الحالي:</label>
                        <input type="text" id="profUsername" class="form-input" readonly style="background: #f1f5f9;">
                        <label>كلمة المرور الجديدة:</label>
                        <input type="password" id="profNewPass" class="form-input" required placeholder="أدخل كلمة المرور الجديدة">
                        <button type="submit" class="btn-action" style="background: #10b981; margin-top: 10px;">تحديث كلمة المرور</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBty7fK-7mchOETrE_vtOZx4dgWSHIuC8Y",
            authDomain: "hr-platform-system.firebaseapp.com",
            databaseURL: "https://hr-platform-system-default-rtdb.firebaseio.com",
            projectId: "hr-platform-system",
            storageBucket: "hr-platform-system.firebasestorage.app",
            messagingSenderId: "994791756938",
            appId: "1:994791756938:web:48303535285e25f1c80973",
            measurementId: "G-7PBDNQ52E9"
        };

        let dbUsers = {};
        let dbCompanies = {};

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            db.ref('.info/connected').on('value', (snap) => {
                const statusBadge = document.getElementById('dbConnectionStatus');
                if (snap.val() === true) {
                    statusBadge.innerText = '● متصل حياً بـ Firebase';
                    statusBadge.className = 'status-badge status-online';
                } else {
                    statusBadge.innerText = '○ غير متصل';
                    statusBadge.className = 'status-badge status-offline';
                }
            });

            db.ref('system_companies').on('value', (snapshot) => {
                dbCompanies = snapshot.val() || {};
                const loggedUser = sessionStorage.getItem('LOGGED_USER');
                if(loggedUser) updateCompanyUI(loggedUser);
            });

            db.ref('system_users').on('value', (snapshot) => {
                dbUsers = snapshot.val() || {};
                const loggedUser = sessionStorage.getItem('LOGGED_USER');
                if(loggedUser) updateCompanyUI(loggedUser);
            });

        } catch (e) {
            console.error("Firebase Connection Error:", e);
        }

        function convertImageToBase64(fileInput, hiddenInputId) {
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(hiddenInputId).value = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const encryptedInputPass = btoa(p);

            const foundUser = dbUsers[u];

            if (foundUser && (foundUser.pass === encryptedInputPass || foundUser.pass === p)) {
                sessionStorage.setItem('LOGGED_USER', foundUser.username);
                sessionStorage.setItem('USER_ROLE', foundUser.role);
                document.getElementById('loginScreen').style.display = 'none';
                initSystemUI();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.clear();
            location.reload();
        }

        function initSystemUI() {
            const loggedUser = sessionStorage.getItem('LOGGED_USER');
            const loggedRole = sessionStorage.getItem('USER_ROLE');

            updateCompanyUI(loggedUser);

            document.getElementById('activeUsername').innerText = loggedUser;
            document.getElementById('activeUserRole').innerText = loggedRole === 'admin' ? 'مدير نظام' : 'مستخدم';
            document.getElementById('profUsername').value = loggedUser;

            if (loggedRole === 'admin') {
                document.getElementById('adminTabItem').style.display = 'block';
            } else {
                document.getElementById('adminTabItem').style.display = 'none';
            }
        }

        function updateCompanyUI(username) {
            const userObj = dbUsers[username];
            if (userObj && userObj.companyId && dbCompanies[userObj.companyId]) {
                const comp = dbCompanies[userObj.companyId];
                document.getElementById('sidebarCompName').innerText = comp.name || '';
                document.getElementById('sidebarCompField').innerText = comp.field || '';
                
                const logoImg = document.getElementById('sidebarLogo');
                if (comp.logo) {
                    logoImg.src = comp.logo;
                    logoImg.style.display = 'inline-block';
                } else {
                    logoImg.style.display = 'none';
                }

                document.getElementById('profCompName').value = comp.name || '';
                document.getElementById('profCompField').value = comp.field || '';
                document.getElementById('profCompLogo').value = comp.logo || '';
            } else {
                document.getElementById('sidebarCompName').innerText = username === 'admin' ? 'لوحة مدير النظام' : 'بدون شركة';
                document.getElementById('sidebarCompField').innerText = username === 'admin' ? 'إدارة المنظومة' : '-';
                document.getElementById('sidebarLogo').style.display = 'none';
            }
        }

        function saveCompanyProfile(e) {
            e.preventDefault();
            const loggedUser = sessionStorage.getItem('LOGGED_USER');
            const userObj = dbUsers[loggedUser];
            
            if (userObj && userObj.companyId) {
                const updatedComp = {
                    name: document.getElementById('profCompName').value,
                    field: document.getElementById('profCompField').value,
                    phone: document.getElementById('profCompPhone').value || '',
                    logo: document.getElementById('profCompLogo').value || '',
                    adminName: document.getElementById('profCompAdmin').value || ''
                };

                firebase.database().ref(`system_companies/${userObj.companyId}`).update(updatedComp)
                    .then(() => alert('تم تحديث بروفايل وشعار الشركة بنجاح!'));
            }
        }

        function updateUserPassword(e) {
            e.preventDefault();
            const loggedUser = sessionStorage.getItem('LOGGED_USER');
            const newPass = document.getElementById('profNewPass').value;

            if (dbUsers[loggedUser]) {
                firebase.database().ref(`system_users/${loggedUser}/pass`).set(btoa(newPass))
                    .then(() => {
                        alert('تم تحديث كلمة المرور بنجاح!');
                        document.getElementById('profNewPass').value = '';
                    });
            }
        }

        function loadPage(evt, frameId, btnElement) {
            if (evt && evt.preventDefault) evt.preventDefault();
            
            document.querySelectorAll('.page-frame').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.submenu-btn').forEach(b => b.classList.remove('active'));
            
            const targetFrame = document.getElementById(frameId);
            if (targetFrame) targetFrame.classList.add('active');

            if (btnElement) {
                if (typeof btnElement === 'string') {
                    const btn = document.querySelector(btnElement);
                    if (btn) btn.classList.add('active');
                } else if (btnElement.classList) {
                    btnElement.classList.add('active');
                }
            }
        }

        function toggleSubmenu(id) {
            const el = document.getElementById(id);
            if(el) el.classList.toggle('active');
        }

        function loadDropdownPage(evt, frameId, title, btnElement) {
            if (evt && evt.stopPropagation) evt.stopPropagation();
            loadPage(evt, frameId, btnElement);
        }

        window.onload = function() {
            const logged = sessionStorage.getItem('LOGGED_USER');
            if (logged) {
                document.getElementById('loginScreen').style.display = 'none';
                initSystemUI();
            }
        };
    </script>
</body>
</html>
