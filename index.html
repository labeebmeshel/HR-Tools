<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة الموارد البشرية والشركات الشاملة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0b4fb3;
            --primary-dark: #0b2a5c;
            --bg-light: #f4f7fc;
            --sidebar-width: 270px;
            --white: #ffffff;
            --text: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-light); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        #loginScreen {
            position: fixed; inset: 0; background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            z-index: 99999; display: flex; align-items: center; justify-content: center;
        }
        .login-card { background: white; width: 420px; padding: 35px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; }
        .login-card h2 { color: var(--primary-dark); margin-bottom: 20px; font-size: 1.4rem; }
        .form-input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .btn-action { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: var(--primary-dark); }
        .login-error { color: var(--danger); font-size: 0.85rem; margin-top: 10px; display: none; }

        .sidebar {
            width: var(--sidebar-width); background: var(--primary-dark); color: white;
            display: flex; flex-direction: column; height: 100vh; z-index: 1000; flex-shrink: 0;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .sidebar-header { padding: 20px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .company-logo-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #fcd34d; background: #fff; display: none; }
        .sidebar-header h3 { font-size: 1rem; color: #fff; font-weight: bold; }
        .sidebar-header p { font-size: 0.75rem; color: #fcd34d; margin-top: 2px; }

        .nav-list { flex: 1; overflow-y: auto; padding: 15px 10px; list-style: none; }
        .nav-item { margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 11px 14px;
            color: rgba(255,255,255,0.8); text-decoration: none; border-radius: 8px;
            cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: 0.2s; border: none; background: none; width: 100%; text-align: right;
        }
        .nav-link:hover, .nav-link.active { background: var(--primary); color: white; }
        .nav-link i { width: 20px; text-align: center; font-size: 1.05rem; }

        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .btn-logout { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

        .main-wrapper { flex: 1; height: 100vh; position: relative; overflow: hidden; }
        .page-frame { width: 100%; height: 100%; border: none; display: none; }
        .page-frame.active { display: block; }

        .inner-view { padding: 30px; height: 100%; overflow-y: auto; background: var(--bg-light); }
        .card-panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-panel h3 { color: var(--primary-dark); margin-bottom: 15px; font-size: 1.1rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }

        /* الشجرة التنظيمية */
        .tree-container { font-size: 0.9rem; line-height: 1.8; }
        .tree-node { margin-right: 15px; border-right: 2px dashed var(--border); padding-right: 10px; margin-top: 5px; }
        .tree-title {
            display: flex; align-items: center; justify-content: space-between;
            background: #f1f5f9; padding: 8px 12px; border-radius: 8px; margin-bottom: 5px;
        }
        .tree-user { background: #e0f2fe; color: #0369a1; font-weight: bold; }
        .tree-company { background: #fef3c7; color: #92400e; }
        .tree-branch { background: #d1fae5; color: #065f46; }

        .btn-edit-sm { background: var(--warning); color: white; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }

        @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-card">
            <i class="fas fa-user-shield fa-3x" style="color: var(--primary); margin-bottom: 15px;"></i>
            <h2>تسجيل الدخول للنظام</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="text" id="loginUsername" class="form-input" placeholder="اسم المستخدم" required>
                <input type="password" id="loginPassword" class="form-input" placeholder="كلمة المرور" required>
                <button type="submit" class="btn-action">دخول</button>
            </form>
            <div id="loginError" class="login-error">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <img id="sidebarLogo" src="" class="company-logo-img" alt="لوجو الشركة">
            <h3 id="sidebarCompName">اسم الشركة</h3>
            <p id="sidebarCompField">مجال الشركة</p>
        </div>
        
        <ul class="nav-list" id="mainNav">
            <li class="nav-item"><button class="nav-link active" onclick="loadPage(event, 'home-frame', this)"><i class="fas fa-house"></i> الرئيسية</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadPage(event, 'forms-print-frame', this)"><i class="fas fa-print"></i> طباعة النماذج الرسمية</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadPage(event, 'labels-frame', this)"><i class="fas fa-tags"></i> ملصقات الموظفين (A4)</button></li>
            <li class="nav-item" id="adminTabItem" style="display: none;">
                <button class="nav-link" style="color: #fcd34d;" onclick="loadPage(event, 'admin-dashboard-frame', this)"><i class="fas fa-user-shield"></i> لوحة الأدمن والشجرة التنظيمية</button>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="user-info">
                <div><strong id="activeUsername">User</strong><br><small id="activeUserRole" style="color: #cbd5e1;">Role</small></div>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-right-from-bracket"></i> خروج</button>
            </div>
        </div>
    </aside>

    <main class="main-wrapper">
        <iframe id="home-frame" class="page-frame active" src="home.html"></iframe>
        <iframe id="forms-print-frame" class="page-frame" src="./hr-forms/index.html"></iframe>
        <iframe id="labels-frame" class="page-frame" src="./labels/index.html"></iframe>

        <!-- لوحة تحكم الأدمن وبها الشجرة التنظيمية -->
        <div id="admin-dashboard-frame" class="page-frame inner-view">
            <h2><i class="fas fa-sitemap"></i> الهيكل التنظيمي والربط (يوزر ➔ شركات ➔ فروع ➔ موظفين)</h2>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">يمكنك تعديل الأسماء مباشرة بالنقر على زر التعديل المالي لكل عنصر</p>
            
            <div class="card-panel">
                <div id="treeViewArea" class="tree-container"></div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { databaseURL: "https://hr-platform-system-default-rtdb.firebaseio.com" };
        let dbUsers = {}, dbCompanies = {}, dbBranches = {}, dbEmployees = [];

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            db.ref('system_companies').on('value', snap => { dbCompanies = snap.val() || {}; renderTreeView(); });
            db.ref('system_users').on('value', snap => { dbUsers = snap.val() || {}; renderTreeView(); });
            db.ref('HR_FORM_SYSTEM_DATA/branches').on('value', snap => { dbBranches = snap.val() || {}; renderTreeView(); });
            db.ref('HR_FORM_SYSTEM_DATA/employees').on('value', snap => { dbEmployees = snap.val() || []; renderTreeView(); });

        } catch (e) { console.error(e); }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const foundUser = dbUsers[u];

            if (foundUser && (foundUser.pass === btoa(p) || foundUser.pass === p)) {
                sessionStorage.setItem('LOGGED_USER', foundUser.username);
                sessionStorage.setItem('USER_ROLE', foundUser.role);
                document.getElementById('loginScreen').style.display = 'none';
                initSystemUI();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() { sessionStorage.clear(); location.reload(); }

        function initSystemUI() {
            const loggedUser = sessionStorage.getItem('LOGGED_USER');
            const loggedRole = sessionStorage.getItem('USER_ROLE');
            document.getElementById('activeUsername').innerText = loggedUser;
            document.getElementById('activeUserRole').innerText = loggedRole === 'admin' ? 'مدير نظام' : 'مستخدم';
            if (loggedRole === 'admin') document.getElementById('adminTabItem').style.display = 'block';
        }

        function renderTreeView() {
            const container = document.getElementById('treeViewArea');
            if (!container) return;
            container.innerHTML = '';

            const usersArr = Object.values(dbUsers).filter(u => u.username !== 'admin');
            usersArr.forEach(u => {
                let html = `
                    <div class="tree-node">
                        <div class="tree-title tree-user">
                            <span><i class="fas fa-user"></i> المستخدم: ${u.username} (${u.role})</span>
                            <button class="btn-edit-sm" onclick="editUserPrompt('${u.username}')"><i class="fas fa-edit"></i> تعديل</button>
                        </div>`;

                const userComps = Object.keys(dbCompanies)
                    .filter(k => dbCompanies[k].userId === u.username || u.companyId === k)
                    .map(k => ({ id: k, ...dbCompanies[k] }));

                userComps.forEach(c => {
                    html += `
                        <div class="tree-node">
                            <div class="tree-title tree-company">
                                <span><i class="fas fa-building"></i> الشركة: ${c.name}</span>
                                <button class="btn-edit-sm" onclick="editCompPrompt('${c.id}', '${c.name}')"><i class="fas fa-edit"></i> تعديل</button>
                            </div>`;

                    const branches = Object.keys(dbBranches)
                        .filter(bk => dbBranches[bk].compId === c.id)
                        .map(bk => ({ id: bk, ...dbBranches[bk] }));

                    branches.forEach(b => {
                        const count = dbEmployees.filter(e => e.compId === c.id && e.branchId === b.id).length;
                        html += `
                            <div class="tree-node">
                                <div class="tree-title tree-branch">
                                    <span><i class="fas fa-code-branch"></i> الفرع: ${b.name} (${count} موظف)</span>
                                    <button class="btn-edit-sm" onclick="editBranchPrompt('${b.id}', '${b.name}')"><i class="fas fa-edit"></i> تعديل</button>
                                </div>
                            </div>`;
                    });

                    html += `</div>`;
                });

                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function editUserPrompt(old) {
            const n = prompt("تعديل اسم المستخدم:", old);
            if(n && n !== old) firebase.database().ref(`system_users/${old}/username`).set(n);
        }
        function editCompPrompt(id, old) {
            const n = prompt("تعديل اسم الشركة:", old);
            if(n && n !== old) firebase.database().ref(`system_companies/${id}/name`).set(n);
        }
        function editBranchPrompt(id, old) {
            const n = prompt("تعديل اسم الفرع:", old);
            if(n && n !== old) firebase.database().ref(`HR_FORM_SYSTEM_DATA/branches/${id}/name`).set(n);
        }

        function loadPage(evt, frameId, btn) {
            if (evt) evt.preventDefault();
            document.querySelectorAll('.page-frame').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.getElementById(frameId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        window.onload = function() {
            if (sessionStorage.getItem('LOGGED_USER')) {
                document.getElementById('loginScreen').style.display = 'none';
                initSystemUI();
            }
        };
    </script>
</body>
</html>
