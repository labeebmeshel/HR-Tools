<!-- نموذج إضافة الموظفين (فردي + استيراد جماعي عبر إكسيل) -->
<h3 style="margin-top: 30px;"><i class="fas fa-user-tie"></i> ② إضافة وتسكين الموظفين تحت حساب محدد</h3>

<div style="display: flex; gap: 10px; margin-bottom: 15px;">
    <button type="button" class="btn-action" style="background: #059669; width: auto;" onclick="downloadFullEmployeesExcelTemplate()">
        <i class="fas fa-file-excel"></i> تحميل قالب إكسيل النماذج الشامل (.xlsx)
    </button>
    
    <label class="btn-action" style="background: #d97706; width: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;">
        <i class="fas fa-file-upload"></i> رفع شيت إكسيل الموظفين
        <input type="file" accept=".xlsx, .xls" style="display: none;" onchange="importFullEmployeesFromExcel(event)">
    </label>
</div>

<!-- Form الإضافة الفردية -->
<form onsubmit="addNewEmployeeToUser(event)">
    <div class="grid-2">
        <div>
            <label>اختر المستخدم / الشركة التابع لها:</label>
            <select id="empUserSelect" class="form-input" required></select>
        </div>
        <div>
            <label>كود الموظف:</label>
            <input type="text" id="empCode" class="form-input" required placeholder="1001">
        </div>
    </div>
    <div class="grid-2">
        <div>
            <label>اسم الموظف الثلاثي/الرباعي:</label>
            <input type="text" id="empName" class="form-input" required placeholder="أحمد محمد علي">
        </div>
        <div>
            <label>الوظيفة / الإدارة:</label>
            <input type="text" id="empJob" class="form-input" required placeholder="أخصائي موارد بشرية">
        </div>
    </div>
    <div class="grid-2">
        <div>
            <label>الرقم القومي (14 رقم):</label>
            <input type="text" id="empNatId" class="form-input" placeholder="29501011201234">
        </div>
        <div>
            <label>الرقم التأميني:</label>
            <input type="text" id="empInsNo" class="form-input" placeholder="123456789">
        </div>
    </div>
    <div class="grid-2">
        <div>
            <label>تاريخ التعيين / الاستلام:</label>
            <input type="date" id="empInsDate" class="form-input">
        </div>
        <div>
            <label>الأجر الشامل (ج.م):</label>
            <input type="number" id="empGrossSalary" class="form-input" placeholder="6000">
        </div>
    </div>
    <button type="submit" class="btn-action" style="background: var(--primary); margin-top: 10px;">إضافة الموظف للشاشات والمستندات</button>
</form>
