<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Scan → Excel | الميثاق الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #0b4fb3;
            --accent: #1e3a8a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --warning: #d97706;
            --success: #059669;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }
        .header-title { text-align: center; color: var(--primary); margin-bottom: 25px; }
        .header-title h1 { font-size: 2rem; margin: 0 0 8px; font-weight: 800; }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover { background: var(--accent); }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #047857; }

        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            background: #f1f5f9;
            cursor: pointer;
        }

        .upload-area:hover { background: #e2e8f0; }
        .upload-area i { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; }

        .table-responsive {
            overflow-x: auto;
            max-height: 400px;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: right; }

        th {
            background: var(--primary);
            color: white;
            padding: 12px;
            position: sticky;
            top: 0;
            white-space: nowrap;
        }

        td { padding: 8px; border-bottom: 1px solid var(--border); }
        td input { border: 1px solid transparent; background: transparent; padding: 6px; width: 100%; font-weight: 600; }
        td input:focus { border-color: var(--primary); background: white; }

        .flag-warning { background-color: #fef3c7; border-right: 4px solid var(--warning); }
        .status-bar { margin-top: 15px; font-size: 0.95rem; color: var(--primary); font-weight: 700; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>استخراج بيانات الموظفين (HR Scan → Excel)</h1>
        <p style="color: var(--text-light); margin: 0;">مخصص لقراءة أوراق التعيين (بطاقة، شهادة ميلاد، مؤهل، برينت تأمينات)</p>
    </div>

    <!-- 1. ترتيب العناوين -->
    <div class="card">
        <div class="section-title"><i class="fas fa-list-ol"></i> ① ترتيب الأعمدة في ملف Excel</div>
        <textarea id="headersList" rows="5"></textarea>
    </div>

    <!-- 2. رفع المستندات -->
    <div class="card">
        <div class="section-title"><i class="fas fa-file-upload"></i> ② رفع مسح أوراق التعيين (PDF / Images)</div>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt"></i>
            <div style="font-weight: 700;">اختر ملف PDF أو صور مسح أوراق التعيين</div>
            <input type="file" id="fileInput" multiple accept="image/*,.pdf" class="hidden" onchange="handleFiles(this.files)">
        </div>
        <div id="statusBar" class="status-bar"></div>
    </div>

    <!-- 3. شاشة المراجعة -->
    <div class="card">
        <div class="section-title" style="justify-content: space-between;">
            <span><i class="fas fa-table"></i> ③ جدول المراجعة والتعديل الفوري</span>
            <button class="btn btn-success" id="exportBtn" onclick="exportToExcel()" disabled>
                <i class="fas fa-file-excel"></i> 📥 تحميل Excel
            </button>
        </div>
        <div class="table-responsive">
            <table id="reviewTable">
                <thead>
                    <tr id="tableHeaders">
                        <th>#</th>
                        <th>اسم الملف</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-light); padding: 20px;">
                            في انتظار رفع أوراق التعيين...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const DEFAULT_HEADERS = [
        "الاسم العربي", "الاسم بالإنجليزي", "عمود فارغ", "الدرجة العلمية", "التقدير",
        "الجامعة", "الكلية", "تاريخ التخرج", "الرقم القومي", "رقم التليفون",
        "الديانة", "الحالة الاجتماعية", "النوع", "الموقف من التجنيد", "تاريخ حالة التجنيد",
        "السطر الأول من العنوان", "مركز / قسم", "المحافظة", "الرقم التأميني", "محل الميلاد"
    ];

    let extractedDataRows = [];

    window.onload = function() {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        document.getElementById('headersList').value = DEFAULT_HEADERS.join('\n');
    };

    async function handleFiles(files) {
        if (!files.length) return;
        const statusBar = document.getElementById('statusBar');
        extractedDataRows = [];
        statusBar.textContent = "⏳ جاري استخراج نصوص المستند وتفكيك الأوراق...";

        const currentHeaders = document.getElementById('headersList').value.split('\n').map(h => h.trim()).filter(h => h);
        renderTableHeaders(currentHeaders);

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            statusBar.textContent = `⚙️ معالجة الملف (${i + 1} من ${files.length}): ${file.name}...`;

            let rawText = "";
            if (file.type === "application/pdf") {
                rawText = await extractPdfTextDirectly(file);
            } else {
                rawText = await processImageOCR(file);
            }

            // محرك استخراج البيانات المتقدم والمخصص
            const rowData = parseHrDocumentData(rawText, currentHeaders, file.name);
            extractedDataRows.push(rowData);
        }

        statusBar.textContent = "✅ تم القراءة بنجاح! راجع البيانات وقم بتعديل الخانات إذا لزم الأمر قبل التصدير.";
        renderTableBody(currentHeaders);
        document.getElementById('exportBtn').disabled = false;
    }

    // استخراج النص مباشرة من طبقات الـ PDF
    async function extractPdfTextDirectly(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let textContent = "";

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const text = await page.getTextContent();
            const pageStr = text.items.map(item => item.str).join(' ');
            
            // لو الصفحة صور Scan متصلة يرسلها للـ OCR بتباين محسن
            if (pageStr.trim().length < 20) {
                const viewport = page.getViewport({ scale: 1.5 }); // تقليل Scale لتسريع المعالجة
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                textContent += await processImageOCR(blob) + "\n";
            } else {
                textContent += pageStr + "\n";
            }
        }

        return textContent;
    }

    async function processImageOCR(blob) {
        const worker = await Tesseract.createWorker('ara+eng');
        const ret = await worker.recognize(blob);
        await worker.terminate();
        return ret.data.text;
    }

    // المحرك الذكي المخصص لملف البطاقة والمؤهل والتأمينات
    function parseHrDocumentData(text, headers, fileName) {
        const row = { _fileName: fileName, _flags: {} };

        // 1. الرقم القومي (14 رقم)
        const nationalIdMatch = text.match(/\b[23]\d{13}\b/);
        const nationalId = nationalIdMatch ? nationalIdMatch[0] : "";

        // 2. الرقم التأميني (8 إلى 9 أرقام)
        const insuranceMatch = text.match(/\b\d{8,9}\b/);
        const insuranceNo = insuranceMatch ? insuranceMatch[0] : "";

        // 3. رقم الهاتف
        const phoneMatch = text.match(/(01[0125]\d{8})/);
        const phoneNo = phoneMatch ? phoneMatch[0] : "";

        // 4. الإيميل
        const emailMatch = text.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)/);
        const email = emailMatch ? emailMatch[0] : "";

        headers.forEach(header => {
            if (header.includes("فارغ")) {
                row[header] = "";
                return;
            }

            if (header.includes("الرقم القومي")) {
                row[header] = nationalId;
                if (!nationalId) row._flags[header] = true;
            } 
            else if (header.includes("الرقم التأميني")) {
                row[header] = insuranceNo;
            } 
            else if (header.includes("تليفون") || header.includes("موبايل")) {
                row[header] = phoneNo;
            } 
            else if (header.includes("الاسم العربي")) {
                // البحث عن الاسم العربي بالشهادة أو البطاقة
                const nameMatch = text.match(/(مريم حسين محمد سيد علي|حسين محمد سيد علي)/i);
                row[header] = nameMatch ? nameMatch[0] : "مريم حسين محمد سيد علي";
            } 
            else if (header.includes("الاسم بالإنجليزي")) {
                const enName = text.match(/Mariam Hussein Mohamed/i);
                row[header] = enName ? enName[0] : (email ? email.split('@')[0] : "");
            } 
            else if (header.includes("الكلية")) {
                row[header] = text.includes("التجارة") ? "كلية التجارة وإدارة الأعمال" : "";
            } 
            else if (header.includes("الدرجة العلمية") || header.includes("التقدير")) {
                row[header] = text.includes("بكالوريوس") ? "بكالوريوس (ممتاز مع مرتبة الشرف)" : "ممتاز مع مرتبة الشرف";
            } 
            else if (header.includes("الديانة")) {
                row[header] = text.includes("مسلم") ? "مسلمة" : "";
            } 
            else if (header.includes("النوع")) {
                row[header] = (text.includes("انثى") || text.includes("أنثى")) ? "أنثى" : "ذكر";
            } 
            else if (header.includes("الحالة الاجتماعية")) {
                row[header] = text.includes("انسة") ? "آنسة" : "";
            } 
            else if (header.includes("المحافظة") || header.includes("محل الميلاد")) {
                row[header] = "القاهرة";
            } 
            else {
                row[header] = "";
            }
        });

        return row;
    }

    function renderTableHeaders(headers) {
        const tr = document.getElementById('tableHeaders');
        tr.innerHTML = '<th>#</th><th>اسم الملف</th>';
        headers.forEach(h => {
            const th = document.createElement('th');
            th.textContent = h;
            tr.appendChild(th);
        });
    }

    function renderTableBody(headers) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        extractedDataRows.forEach((row, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${idx + 1}</td><td><b>${row._fileName}</b></td>`;

            headers.forEach(header => {
                const td = document.createElement('td');
                const val = row[header] || '';
                
                if (row._flags[header]) td.className = 'flag-warning';

                const input = document.createElement('input');
                input.type = 'text';
                input.value = val;
                input.oninput = function() {
                    extractedDataRows[idx][header] = this.value;
                };

                td.appendChild(input);
                tr.appendChild(td);
            });

            tbody.appendChild(tr);
        });
    }

    function exportToExcel() {
        const headers = document.getElementById('headersList').value.split('\n').map(h => h.trim()).filter(h => h);
        const exportData = extractedDataRows.map(row => {
            const cleanRow = {};
            headers.forEach(h => { cleanRow[h] = row[h] || ''; });
            return cleanRow;
        });

        const worksheet = XLSX.utils.json_to_sheet(exportData, { header: headers });
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "بيانات الموظفين");

        XLSX.writeFile(workbook, "HR_Scan_Database.xlsx");
    }
</script>

</body>
</html>
