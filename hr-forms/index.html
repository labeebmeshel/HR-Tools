<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة طباعة النماذج الرسمية | HR Forms</title>
    
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ربط ملفات التنسيق CSS بناءً على مجلد css الظاهر في الهيكل -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/print.css">
</head>
<body>

    <!-- الواجهة الرئيسية لنظام النماذج -->
    <div id="appContainer">
        <!-- القائمة العلوية وأدوات التحكم -->
        <header class="app-header no-print">
            <div class="header-titles">
                <h2><i class="fas fa-print"></i> نظام طباعة النماذج والعقود الرسمية</h2>
                <p>إدارة الشركات، الموظفين، وطباعة النماذج المعتمدة</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="window.print()">
                    <i class="fas fa-print"></i> طباعة النموذج الحالي
                </button>
            </div>
        </header>

        <!-- المحتوى التشغيلي للبرنامج -->
        <main class="app-main">
            <!-- سيتم تحميل لوحة البيانات والسياسات والنماذج ديناميكياً بواسطة ملفات الجافا سكربت -->
            <div id="mainView" class="view-content"></div>
        </main>
    </div>

    <!-- ========================================================= -->
    <!-- ربط ملفات البرمجة JS بناءً على مجلد js الظاهر في الهيكل   -->
    <!-- الترتيب يراعي الاعتمادية (Dependencies) لضمان عدم حدوث أخطاء -->
    <!-- ========================================================= -->
    
    <!-- 1. قاعدة البيانات والتحقق -->
    <script src="js/database.js"></script>
    <script src="js/validation.js"></script>
    
    <!-- 2. إدارة البيانات (الشركات والموظفين) -->
    <script src="js/companies.js"></script>
    <script src="js/employees.js"></script>
    
    <!-- 3. القوالب ومعالجة ملفات الإكسيل -->
    <script src="js/templates.js"></script>
    <script src="js/excel.js"></script>
    
    <!-- 4. محرك الطباعة والتشغيل الرئيسي -->
    <script src="js/print.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
